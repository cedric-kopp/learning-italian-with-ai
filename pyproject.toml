[project]
name = "tutore"
version = "0.1.0"
description = "Local voice-based Italian tutor (STT -> LLM -> TTS), fully open-weight on Apple Silicon"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-multipart>=0.0.12",
    "python-dotenv>=1.0",
    "openai>=1.55",
    "sqlmodel>=0.0.22",
    "mlx-whisper>=0.4.2",
    "kokoro>=0.9.4",
    "soundfile>=0.12",
    "numpy>=1.26,<2.3",
    # Italian lemmatization/POS for flashcard vocab extraction. The model is pinned
    # as a URL dep so `uv sync` installs AND keeps it (a plain `spacy download`
    # gets pruned on the next sync).
    "spacy>=3.8",
    "it-core-news-sm @ https://github.com/explosion/spacy-models/releases/download/it_core_news_sm-3.8.0/it_core_news_sm-3.8.0-py3-none-any.whl",
]

[tool.uv]
# Torch + MLX wheels resolve fine on macOS arm64 / py3.12.

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tutore"]

[tool.hatch.metadata]
# Allow the spaCy model pinned as a direct URL dependency.
allow-direct-references = true
