<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tutore — Italian voice tutor</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="flag" aria-hidden="true"></span>
      <h1>Tutore</h1>
    </div>
    <div class="backend" id="backend" title="Active LLM backend">…</div>
  </header>

  <section class="controls">
    <div class="control">
      <label for="mode">Mode</label>
      <select id="mode">
        <option value="immersion">🇮🇹 Italian immersion</option>
        <option value="english_teacher">🇬🇧 English teacher</option>
      </select>
    </div>
    <div class="control">
      <label for="level">Level</label>
      <select id="level">
        <option>A1</option>
        <option selected>A2</option>
        <option>B1</option>
      </select>
    </div>
    <div class="control">
      <label for="speed">Voice speed <span id="speedVal">0.9×</span></label>
      <input id="speed" type="range" min="0.6" max="1.2" step="0.05" value="0.9" />
    </div>
  </section>

  <main id="log" class="log" aria-live="polite">
    <div class="hint" id="hint">
      Hold the mic button (or press &amp; hold <kbd>Space</kbd>) and speak in Italian.
      Marco will reply out loud and gently correct you.
    </div>
  </main>

  <footer class="mic-bar">
    <button id="mic" class="mic" aria-label="Hold to speak">
      <span class="mic-icon" aria-hidden="true">🎤</span>
      <span class="mic-label" id="micLabel">Hold to speak</span>
    </button>
    <div class="status" id="status"></div>
  </footer>

  <template id="turnTpl">
    <div class="turn">
      <div class="you">
        <div class="who">You said</div>
        <div class="said"></div>
        <div class="conf" title="How clearly speech-to-text understood you"></div>
      </div>
      <div class="corrections"></div>
      <div class="marco">
        <div class="who">Marco</div>
        <div class="reply"></div>
        <button class="replay" title="Replay audio">▶ Replay</button>
      </div>
      <div class="vocab"></div>
    </div>
  </template>

  <script src="/app.js" type="module"></script>
</body>
</html>
